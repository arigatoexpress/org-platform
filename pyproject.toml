[project]
name = "org-platform"
version = "0.1.0"
description = "Sapphire autonomous intelligence organization platform"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["feeds*", "normalize*", "enrich*", "store*", "crypto*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
